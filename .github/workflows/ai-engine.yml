name: Avalon AI Engine (CI only)

# Operation Phoenix (2026-11-13): the owners retired every AUTONOMOUS execution of REN and the managers.
# This workflow is now plain CI for the engine code: no schedule, no secrets, no AI provider calls, no write permissions.
# Removed (history stays in git): the 6-hour cron, `live-smoke`, `ren-dev-task` (REN's own branch + draft PR),
# `managers` (routine + ledger comments) and `intake` (processing avalon:task issues).
# Guaranteed by tests/ai-engine-workflow.test.cjs, which also fails if ANY workflow re-introduces an autonomous trigger.

on:
  pull_request:
    paths:
      - 'src/lib/ai-engine/**'
      - 'scripts/ai-engine/**'
      - 'tests/ai-engine*'
      - 'supabase/migrations/*ai_engine*.sql'
      - '.github/workflows/ai-engine.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/ai-engine/**'
      - 'scripts/ai-engine/**'
      - 'tests/ai-engine*'
      - 'supabase/migrations/*ai_engine*.sql'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avalon-ai-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tests/qa
      - run: node --test tests/ai-engine.test.cjs tests/ai-engine-ops.test.cjs tests/ai-engine-workflow.test.cjs
      - run: node --test tests/ai-engine.database.cjs
        env:
          NODE_PATH: ./tests/qa/node_modules
