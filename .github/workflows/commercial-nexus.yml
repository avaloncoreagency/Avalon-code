name: Commercial Nexus presentation acceptance
on:
  pull_request:
    paths:
      - 'src/components/crm/commercial-journey*'
      - 'src/lib/crm/commercial-journey.ts'
      - 'src/lib/crm/operational-agenda.ts'
      - 'src/app/admin/workspace/crm/lead/**'
      - 'src/app/admin/workspace/crm/calendar/page.tsx'
      - 'tests/nexus*'
      - '.github/workflows/commercial-nexus.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  presentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix tests/qa --no-audit --no-fund
      - run: node tests/qa/node_modules/playwright/cli.js install --with-deps chromium
      - run: node --test tests/nexus-journey.test.cjs
        env:
          NODE_PATH: ./tests/qa/node_modules
          NEXUS_BROWSER: '1'
          NEXUS_EVIDENCE_DIR: evidence/nexus
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nexus-presentation-${{ github.sha }}
          path: evidence/nexus
          if-no-files-found: warn
          retention-days: 3
