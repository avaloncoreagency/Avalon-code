name: Dev Bridge PR handoff preflight
on:
  # PAUSED 2026-11-10 (Avalon recovery mode): automatic triggers disabled to avoid unnecessary runs.
  # Manual runs still work (Actions → Run workflow). To restore, uncomment the original triggers below.
  workflow_dispatch:
  #  pull_request:
  #    types: [opened, reopened, synchronize, ready_for_review, edited]
permissions:
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: dev-bridge-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  metadata:
    # Do not execute an arbitrary external contributor branch with GitHub credentials.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'
      - name: Read-only PR collaboration preflight
        run: node scripts/dev-bridge/pr-preflight.cjs
        env:
          GH_TOKEN: ${{ github.token }}
