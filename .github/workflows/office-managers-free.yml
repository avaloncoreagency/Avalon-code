name: Avalon Office managers — zero-cost GitHub checks

on:
  # PAUSED 2026-11-10 (Avalon recovery mode): automatic triggers disabled to avoid unnecessary runs.
  # Manual runs still work (Actions → Run workflow). To restore, uncomment the original triggers below.
  workflow_dispatch:
  #  # This workflow executes on the DEFAULT BRANCH only, after reviewed merge.
  #  # Repository is public: standard GitHub-hosted runners are free.
  #  schedule:
  #    - cron: '19 * * * *'

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

concurrency:
  group: avalon-office-github-free-ledger
  cancel-in-progress: false

jobs:
  verify-and-report:
    name: Five GitHub-native checks, one verified report
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    # Optional kill-switch for administrators. No paid APIs, DB or secrets.
    if: ${{ github.event.repository.private == false && vars.AVALON_OFFICE_FREE_CHECKS_DISABLED != 'true' }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Test free runner locally without network
        run: node --test tests/office-manager-free-github.test.cjs
      - name: Read GitHub status and update one evidence issue
        run: node scripts/office-manager-free-github.cjs
