name: CRM isolated verification
on:
  pull_request:
    paths:
      - 'src/**/crm/**'
      - 'supabase/migrations/*crm*.sql'
      - 'tests/crm*'
      - 'tests/radar-profile.database.cjs'
      - 'tests/crm-intel*'
      - 'tests/helpers/**'
      - 'supabase/migrations/*radar*.sql'
      - 'tests/qa/**'
      - '.github/workflows/crm.yml'
permissions:
  contents: read
jobs:
  crm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tests/qa
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:integration
      - run: npm run bridge:test
      - run: node tests/qa/node_modules/playwright/cli.js install --with-deps chromium || (echo "::warning::apt mirrors unreachable; installing Chromium without extra system fonts (ubuntu-24.04 already ships Chrome libraries). Browser tests still run." && node tests/qa/node_modules/playwright/cli.js install chromium)
      - run: node --test tests/crm.database.cjs tests/unified.database.cjs tests/sales.database.cjs tests/crm.integration.cjs tests/radar-server-scheduler.database.cjs tests/radar-profile.database.cjs tests/crm-intelligence.database.cjs tests/crm-intelligence.browser.cjs tests/prod-schema-compat.browser.cjs
        env:
          NODE_PATH: ./tests/qa/node_modules
          CRM_BROWSER: '1'
          CRM_INTEL_BROWSER: '1'
          EVIDENCE_DIR: evidence/crm-intelligence
