name: Public inquiry review SQL
on:
  pull_request:
    paths:
      - 'docs/sql/public-inquiry-services-review.sql'
      - 'tests/inquiry-history.database.cjs'
      - 'docs/sql/public-intake-role-review.sql'
      - 'tests/intake-role.database.cjs'
      - 'tests/public-inquiry.database.cjs'
      - 'tests/fv2-*.database.cjs'
      - 'tests/helpers/**'
      - 'supabase/migrations/**'
      - '.github/workflows/public-inquiry-review.yml'
permissions:
  contents: read
concurrency:
  group: public-inquiry-${{ github.ref }}
  cancel-in-progress: true
jobs:
  negative-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/qa/package-lock.json
      - run: npm ci --ignore-scripts --prefix tests/qa --no-audit --no-fund
      - run: NODE_PATH=tests/qa/node_modules node --test --test-concurrency=1 tests/public-inquiry.database.cjs tests/inquiry-history.database.cjs tests/intake-role.database.cjs tests/definer-gates.test.cjs tests/fv2-intake-matrix.database.cjs tests/fv2-migrations.database.cjs tests/fv2-commercial-chain.database.cjs tests/fv2-capacity.database.cjs
