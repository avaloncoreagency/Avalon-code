name: Avalon OS modules verification
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'tests/sql/**'
      - 'tests/os*'
      - 'src/**'
      - '.github/workflows/os-modules.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  database:
    name: RLS and triggers on isolated PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply stub and all migrations (incl. crm_core), then run RLS assertions
        run: |
          psql -v ON_ERROR_STOP=1 -q \
            -f tests/sql/00_supabase_stub.sql \
            -f supabase/migrations/20261102053022_avalon_owner_memberships_rls.sql \
            -f supabase/migrations/20261102053452_harden_membership_table_grants.sql \
            -f supabase/migrations/20261102070500_avalon_os_modules.sql \
            -f supabase/migrations/20261102085430_crm_core.sql \
            -f supabase/migrations/20261107090000_ai_chatbots_module.sql \
            -f tests/sql/os_modules_rls.test.sql \
            -f tests/sql/crm_core_rls.test.sql \
            -f tests/sql/chatbots_module_rls.test.sql
