name: Avalon security checks
on:
  pull_request:
    # Stacked PRs must pass security CI before integration into main.
    branches: [main, integration/avalon-v1, claude/crm-intelligence]
  push:
    branches: [main]
  schedule:
    - cron: "17 10 * * 1" # Mondays 10:17 UTC
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Full audit report (informational)
        run: npm audit --package-lock-only || true
      - name: Block high and critical vulnerabilities in production dependencies
        run: npm audit --package-lock-only --omit=dev --audit-level=high

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Blocking gate for newly introduced high/critical vulnerabilities.
    # GitHub Dependency review was verified operational in Security Recovery CI.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@3c4e3dcb1aa7874d2c16be7d79418e9b7efd6261
        with:
          fail-on-severity: high

  security-tests:
    name: Security regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Static security, authorization and migration guards
        run: node --test tests/security.test.cjs tests/security-reporting.test.cjs tests/security-workflow-pins.test.cjs

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9
        with:
          category: "/language:javascript-typescript"
