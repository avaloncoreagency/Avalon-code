name: Avalon security checks
on:
  pull_request:
    # Stacked PRs must pass security CI before integration into main.
    branches: [main, integration/avalon-v1, claude/crm-intelligence]
  push:
    branches: [main]
  schedule:
    - cron: "17 10 * * 1" # Mondays 10:17 UTC
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full audit report (informational)
        run: npm audit --package-lock-only || true
      - name: Block high and critical vulnerabilities in production dependencies
        run: npm audit --package-lock-only --omit=dev --audit-level=high

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Requires "Dependency graph" (Settings → Code security), which an admin must
    # enable (finding R-09). Informational until then; npm audit above is the gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  security-tests:
    name: Security regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Static security, authorization and migration guards
        run: node --test tests/security.test.cjs

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
