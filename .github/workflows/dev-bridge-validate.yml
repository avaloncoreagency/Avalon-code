name: Dev Bridge validate
on:
  # PAUSED 2026-11-10 (Avalon recovery mode): automatic triggers disabled to avoid unnecessary runs.
  # Manual runs still work (Actions → Run workflow). To restore, uncomment the original triggers below.
  workflow_dispatch:
  #  pull_request:
  #    paths: ['src/lib/dev-bridge/**', 'src/app/admin/dev-bridge/**', 'src/app/api/dev-bridge/**', 'scripts/dev-bridge/**', 'schemas/dev-bridge/**', 'tests/dev-bridge/**', 'tests/auth.integration.cjs', '.github/workflows/dev-bridge-*.yml', 'package*.json']
  #  push:
  #    branches: [main]
permissions:
  contents: read
concurrency:
  group: dev-bridge-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run bridge:test
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:integration
      # Dev Bridge 3.0 ledger: SQL (PGlite, RLS, definer RPCs) and the end-to-end page → API route → session CLI path.
      - run: npm ci --prefix tests/qa --no-audit --no-fund
      - run: node tests/qa/node_modules/playwright/cli.js install chromium
      - run: node --test tests/dev-bridge-ledger.database.cjs tests/dev-bridge-ledger.browser.cjs
        env:
          NODE_PATH: ./tests/qa/node_modules
          DEV_BRIDGE_BROWSER: '1'
          EVIDENCE_DIR: evidence/dev-bridge-ledger
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dev-bridge-ledger-evidence
          path: evidence/dev-bridge-ledger
          retention-days: 7
      - run: echo 'Unit and synthetic HTTP checks passed. Live owner login and provider health require separate verification.' >> "$GITHUB_STEP_SUMMARY"
