name: Dev Bridge validate
on:
  # PAUSED 2026-11-10 (Avalon recovery mode): automatic triggers disabled to avoid unnecessary runs.
  # Manual runs still work (Actions → Run workflow). To restore, uncomment the original triggers below.
  workflow_dispatch:
  #  pull_request:
  #    paths: ['src/lib/dev-bridge/**', 'src/app/admin/dev-bridge/**', 'src/app/api/dev-bridge/**', 'scripts/dev-bridge/**', 'schemas/dev-bridge/**', 'tests/dev-bridge/**', 'tests/auth.integration.cjs', '.github/workflows/dev-bridge-*.yml', 'package*.json']
  #  push:
  #    branches: [main]
permissions:
  contents: read
concurrency:
  group: dev-bridge-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run bridge:test
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:integration
      - run: echo 'Unit and synthetic HTTP checks passed. Live owner login and provider health require separate verification.' >> "$GITHUB_STEP_SUMMARY"
