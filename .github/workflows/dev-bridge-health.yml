name: Dev Bridge doctor
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dev-bridge-doctor
  cancel-in-progress: true
jobs:
  doctor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run bridge:doctor
        env:
          GH_TOKEN: ${{ github.token }}
          BRIDGE_VERCEL_TOKEN: ${{ secrets.BRIDGE_VERCEL_TOKEN }}
          BRIDGE_VERCEL_PROJECT: prj_tN1ZYrsx5fqoEePYjThsra3MvocP
          BRIDGE_VERCEL_TEAM: team_lHTO3wgJm0yAyexxMDmkIFW4
          BRIDGE_SUPABASE_TOKEN: ${{ secrets.BRIDGE_SUPABASE_TOKEN }}
          BRIDGE_SUPABASE_REF: ltbwzcrxeuczdhhtbqgm
