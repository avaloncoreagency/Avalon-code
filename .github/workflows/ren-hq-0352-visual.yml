name: REN HQ 0352-A — isolated visual acceptance

on:
  push:
    branches:
      - feature/ren-hq-0352a-visual-20261105

permissions:
  contents: read

concurrency:
  group: ren-hq-0352-visual
  cancel-in-progress: true

jobs:
  hq-visual:
    # Keep this one-off QA lane on standard no-cost public GitHub runners.
    if: github.repository == 'avaloncoreagency/Avalon-code' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      NODE_PATH: ./tests/qa/node_modules
      HQ_BROWSER: '1'
      HQ_EVIDENCE: artifacts/hq-0352
      # Browser fixture injects a fresh synthetic bridge port into next start.
      # Do not freeze NEXT_PUBLIC_SUPABASE_URL during next build: that hardcodes a dead port.
    steps:
      - name: Checkout exact PR HEAD (read-only, no token persistence)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies for app and synthetic QA
        run: npm ci --no-audit --no-fund && npm ci --prefix tests/qa --no-audit --no-fund
      - name: Lint, TypeScript, source and GLB integrity
        run: |
          npm run lint
          npm run typecheck
          npm test
      - name: Build exact PR HEAD without any production credentials
        run: npm run build
      - name: Reuse runner Chrome for synthetic owner-only browser QA
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
            echo "Using preinstalled runner Chrome; no download required"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
            echo "Using preinstalled runner Chromium; no download required"
          else
            node tests/qa/node_modules/playwright/cli.js install --with-deps chromium
          fi
      - name: HQ 3D desktop, iPhone, one scene, real-data drawers and screenshots
        run: node --test tests/office-hq.browser.cjs
      - name: Publish synthetic visual captures and performance metrics (short retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ren-hq-0352-visual-evidence
          path: artifacts/hq-0352/
          if-no-files-found: warn
          retention-days: 3
