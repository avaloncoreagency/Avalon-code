name: Client experience (onboarding, e-mail, manuals, Agent Portal invitations)
on:
  pull_request:
    paths:
      - 'src/lib/comms/**'
      - 'src/lib/onboarding/**'
      - 'src/lib/docs/**'
      - 'src/lib/agents/**'
      - 'src/lib/contracts/**'
      - 'src/components/agents/**'
      - 'src/components/crm/client-experience.tsx'
      - 'src/app/admin/settings/communications/**'
      - 'src/app/admin/workspace/crm/onboarding/**'
      - 'src/app/admin/workspace/crm/clients/**'
      - 'supabase/migrations/20261124140000_client_experience.sql'
      - 'supabase/templates/**'
      - 'scripts/email/**'
      - 'scripts/docs/**'
      - 'docs/sales-enablement/**'
      - 'docs/client-operations/**'
      - 'src/app/admin/workspace/crm/documents/**'
      - 'tests/client-experience*'
      - 'tests/agent-portal*'
      - 'tests/staff-portal*'
      - 'tests/staff-invite-signature*'
      - 'src/app/admin/staff/**'
      - 'src/app/staff/**'
      - 'src/components/staff/**'
      - 'src/app/admin/workspace/crm/messages/**'
      - 'supabase/functions/staff-invite/**'
      - 'supabase/functions/_shared/**'
      - '.github/workflows/client-experience.yml'
concurrency:
  group: client-experience-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  client-experience:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tests/qa
      - run: node scripts/email/build-auth-templates.cjs --check
      - run: node scripts/docs/build-library.cjs --check
      - run: npm run typecheck
      - run: node --test tests/client-experience.test.cjs tests/staff-invite-signature.test.cjs
      - run: npm run build
      - run: node tests/qa/node_modules/playwright/cli.js install --with-deps chromium || node tests/qa/node_modules/playwright/cli.js install chromium
      - run: node --test --test-concurrency=1 tests/client-experience.database.cjs tests/client-experience.browser.cjs tests/agent-portal.browser.cjs tests/staff-portal.browser.cjs
        env:
          NODE_PATH: ./tests/qa/node_modules
          CLIENT_EXPERIENCE_BROWSER: '1'
          AGENT_PORTAL_BROWSER: '1'
          STAFF_BROWSER: '1'
          EVIDENCE_DIR: evidence/client-experience
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: client-experience-evidence
          path: evidence/client-experience
          if-no-files-found: ignore
