name: Creative Bridge isolated PostgreSQL
on:
  # PAUSED 2026-11-10 (Avalon recovery mode): automatic triggers disabled to avoid unnecessary runs.
  # Manual runs still work (Actions → Run workflow). To restore, uncomment the original triggers below.
  workflow_dispatch:
  #  pull_request:
  #    paths:
  #      - 'docs/sql/creative-bridge-registration.sql'
  #      - 'src/lib/os/creative-bridge-protocol.ts'
  #      - 'src/app/api/creative-bridge/**'
  #      - 'src/lib/supabase/middleware.ts'
  #      - 'tests/creative-bridge*'
  #      - 'tests/higgsfield-handoff.test.cjs'
  #      - '.github/workflows/creative-bridge.yml'
permissions:
  contents: read
jobs:
  bridge-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix tests/qa
      - name: Real SQL in isolated PGlite with synthetic users
        run: node --test tests/creative-bridge.database.cjs
        env:
          NODE_PATH: ./tests/qa/node_modules
      - name: Signed protocol and module workflow
        run: node --test tests/creative-bridge.test.cjs tests/higgsfield-handoff.test.cjs
      - name: Actual signed POST on Next.js with synthetic Supabase Auth and RPC
        run: node --test tests/creative-bridge.http.cjs
        env:
          NEXT_TELEMETRY_DISABLED: '1'
