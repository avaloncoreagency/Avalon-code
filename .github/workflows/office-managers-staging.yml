name: Avalon Office managers - isolated staging

on:
  # Manual-only contingency. The default zero-cost runner is office-managers-free.yml.
  workflow_dispatch:
    inputs:
      manager:
        description: "Choose a staging manager diagnostic"
        required: true
        type: choice
        default: all
        options: [all, ren, shin, haru, sora, kenji]

permissions:
  contents: read

concurrency:
  group: avalon-office-staging-managers
  cancel-in-progress: false

jobs:
  diagnostics:
    name: Five bounded checks in isolated Supabase staging
    runs-on: ubuntu-latest
    timeout-minutes: 9
    environment: avalon-staging-managers
    env:
      AVALON_STAGING_SUPABASE_URL: ${{ secrets.AVALON_STAGING_SUPABASE_URL }}
      AVALON_MANAGER_STAGING_SUPABASE_REF: ${{ vars.AVALON_MANAGER_STAGING_SUPABASE_REF }}
      AVALON_STAGING_SERVICE_ROLE_KEY: ${{ secrets.AVALON_STAGING_SERVICE_ROLE_KEY }}
      MANAGER_CHOICE: ${{ inputs.manager || 'all' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned tools
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Exercise worker with synthetic fixtures (zero network)
        run: node --test tests/office-manager-runner.test.cjs
      - name: Execute owner-reviewed read-only checks in staging
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$AVALON_STAGING_SUPABASE_URL" ] || [ -z "$AVALON_STAGING_SERVICE_ROLE_KEY" ] || [ -z "$AVALON_MANAGER_STAGING_SUPABASE_REF" ]; then
            echo "Isolated staging credentials are not configured. No production fallback."
            exit 1
          fi
          node scripts/office-manager-staging-poll.cjs
