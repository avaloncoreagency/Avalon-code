name: Avalon Auth Review CI
on:
  pull_request:
    branches:
      - main
      - feature/avalon-auth-rls
      - feature/sprint-01-miguel-google-auth
  workflow_dispatch:
  push:
    branches:
      - feature/avalon-auth-rls
      - feature/sprint-01-miguel-google-auth
      - feature/avalon-profile-menu-preview
# Cancel outdated checks when the same branch/PR receives a newer commit.
# Different PRs and the protected main branch remain isolated.
concurrency:
  group: auth-review-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Auth and migration security tests
        run: npm test
      - name: Production build (not deployed)
        run: npm run build
      - name: SSR authentication integration
        run: npm run test:integration
