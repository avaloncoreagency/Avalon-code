name: Avalon Auth Review CI
on:
  pull_request:
    branches:
      - feature/avalon-auth-rls
  workflow_dispatch:
  push:
    branches:
      - feature/avalon-auth-rls
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Auth tests
        run: npm test
      - name: Production build (not deployed)
        run: npm run build
      - name: SSR authentication integration
        run: npm run test:integration
