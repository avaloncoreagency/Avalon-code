name: Avalon Auth Review CI
on:
  pull_request:
    branches:
      - main
      - feature/avalon-auth-rls
      - feature/sprint-01-miguel-google-auth
  workflow_dispatch:
  push:
    branches:
      - feature/avalon-auth-rls
      - feature/sprint-01-miguel-google-auth
      - feature/avalon-profile-menu-preview
# Cancel outdated checks when the same branch/PR receives a newer commit.
# Different PRs and the protected main branch remain isolated.
concurrency:
  group: auth-review-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Detect docs-only pull requests
        if: github.event_name == 'pull_request'
        id: docs
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha }}"
          result=false
          if [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]] && git fetch --no-tags --depth=1 origin "$base_sha"; then
            changed="$(mktemp)"
            if git diff --name-only -z --no-ext-diff "$base_sha" HEAD -- > "$changed"; then
              # A PR must not change the classifier/workflow and simultaneously skip tests.
              if git diff --quiet "$base_sha" HEAD -- scripts/ci/docs-only.cjs .github/workflows/auth-review.yml; then
                if classified="$(node scripts/ci/docs-only.cjs "$changed")"; then result="$classified"; fi
              fi
            fi
          fi
          printf 'docs_only=%s\n' "$result" >> "$GITHUB_OUTPUT"
      - name: Explain documentation-only safe bypass
        if: steps.docs.outputs.docs_only == 'true'
        run: echo 'Documentation-only PR; expensive Auth Review build/test steps intentionally skipped; security checks remain separate.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.docs.outputs.docs_only != 'true'
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        if: steps.docs.outputs.docs_only != 'true'
        run: npm ci
      - name: Lint
        if: steps.docs.outputs.docs_only != 'true'
        run: npm run lint
      - name: Typecheck
        if: steps.docs.outputs.docs_only != 'true'
        run: npm run typecheck
      - name: Auth and migration security tests
        if: steps.docs.outputs.docs_only != 'true'
        run: npm test
      - name: Production build (not deployed)
        if: steps.docs.outputs.docs_only != 'true'
        run: npm run build
      - name: SSR authentication integration
        if: steps.docs.outputs.docs_only != 'true'
        run: npm run test:integration
