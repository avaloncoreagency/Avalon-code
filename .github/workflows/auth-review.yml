name: Avalon Auth Review CI
on:
  pull_request:
    branches:
      - main
      - feature/avalon-auth-rls
      - feature/sprint-01-miguel-google-auth
  workflow_dispatch:
  push:
    branches:
      - feature/avalon-auth-rls
      - feature/sprint-01-miguel-google-auth
      - feature/avalon-profile-menu-preview
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Auth and migration security tests
        run: npm test
      - name: Production build (not deployed)
        run: npm run build
      - name: SSR authentication integration
        run: npm run test:integration
